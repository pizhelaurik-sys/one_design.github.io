<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моё портфолио</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f3ef;
      color: #202020;
    }

    main {
      max-width: 960px;
      margin: auto;
      padding: 80px 24px;
    }

    .label { color: #635bff; font-weight: 600; }

    h1 {
      font-size: clamp(40px, 8vw, 80px);
      line-height: 1.05;
      margin: 20px 0;
    }

    p { font-size: 20px; line-height: 1.6; }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin: 40px 0;
    }

    article {
      padding: 28px;
      border-radius: 20px;
      background: white;
    }

    article p { font-size: 16px; }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 12px;
      background: #202020;
      color: white;
      text-decoration: none;
    }

    .button:hover { background: #635bff; }
    a:focus-visible { outline: 3px solid #635bff; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <span class="label">ДИЗАЙНЕР · ПОРТФОЛИО</span>
    <h1>Привет! Я Александр.<br>Создаю удобные интерфейсы.</h1>
    <p>Помогаю брендам превращать идеи в понятные цифровые продукты.</p>

    <section class="projects" aria-label="Мои проекты">
      <article>
        <h2>Сайт бренда</h2>
        <p>Концепция, визуальный стиль и адаптивный дизайн.</p>
      </article>
      <article>
        <h2>Мобильное приложение</h2>
        <p>Исследование, пользовательские сценарии и интерфейс.</p>
      </article>
    </section>

    <a class="button" href="mailto:pizhelaurik@mail.ru">Связаться со мной</a>
  </main>
</body>
</html>
